<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field Service Hours Breakdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --card:#fff; --ink:#16202b; --mute:#5d6b7a; --line:#d9dfe6; --field:#f6f8fa;
  --outage:#f5c400; --outage-soft:#fff8d6;
  --non:#8a96a3; --non-soft:#eceff2;
  --con:#1f8fd1; --con-soft:#e1f2fc;
  --panel:#14263a; --panel-ink:#f3f6f9; --accent:#f26b21;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e141b;--card:#18212b;--ink:#e8edf2;--mute:#93a1b0;--line:#2a3643;--field:#111922;
    --outage-soft:#3a3310;--non-soft:#222c37;--con-soft:#10303f;--panel:#0a0f15;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.45;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--con);outline-offset:2px}
header{background:var(--panel);color:var(--panel-ink);border-bottom:4px solid var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:22px 20px 20px}
.top h1{margin:0 0 8px;font-size:15px;font-weight:500;color:#aab7c4}
.top input{background:transparent;border:0;border-bottom:1px solid #3a4756;color:#fff;font-size:22px;font-weight:600;width:min(640px,100%);padding:4px 0}
.top input:focus{outline:none;border-color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--mute)}
.btn.dark{background:transparent;color:#e8edf2;border-color:#3a4756}
.btn.dark:hover{border-color:#8393a4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#16202b;font-weight:600}
main{display:grid;grid-template-columns:1fr 300px;gap:24px;align-items:start;padding:24px 20px 60px}
.days{display:grid;gap:18px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;border-left:8px solid var(--c)}
.day[data-type=outage]{--c:var(--outage);--s:var(--outage-soft)}
.day[data-type=non]{--c:var(--non);--s:var(--non-soft)}
.day[data-type=con]{--c:var(--con);--s:var(--con-soft)}
.dh{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 16px;background:var(--s)}
.dh textarea{overflow:hidden;width:100%;resize:vertical;min-height:44px;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;font-weight:600;font-size:15px}
.dh textarea:hover,.dh textarea:focus{background:var(--card);border-color:var(--line)}
.meta{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
.meta b{font-size:13px;color:var(--mute);font-weight:600}
.meta select{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 8px;font-size:13px}
.dt{text-align:right}
.dt small{display:block;color:var(--mute);font-size:12px}
.dt strong{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.grid{padding:6px 16px 14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:430px}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:8px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:4px 6px;border-top:1px solid var(--line)}
td.lbl{font-weight:500;width:34%}
td.lbl span{display:block;font-size:11px;color:var(--mute);font-weight:400}
td input{width:100%;max-width:92px;margin-left:auto;display:block;text-align:right;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font-variant-numeric:tabular-nums}
td input:focus{border-color:var(--con);outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--con) 30%,transparent)}
.grip{border:0;background:none;cursor:grab;color:var(--mute);padding:4px 6px;border-radius:6px;touch-action:none;display:inline-flex}
.grip:hover{color:var(--ink);background:var(--card)}
.day.dragging{position:relative;z-index:5;box-shadow:0 14px 34px rgba(0,0,0,.28);cursor:grabbing}
body.dragging-body{user-select:none;-webkit-user-select:none;cursor:grabbing}
.dl{width:130px;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font-size:14px;font-weight:700}
.dl:hover,.dl:focus{background:var(--card);border-color:var(--line)}
td.lbl .cp{display:block;margin-top:3px;background:none;border:1px solid var(--line);border-radius:5px;padding:1px 8px;font-size:11px;color:var(--mute);cursor:pointer}
td.lbl .cp:hover{border-color:var(--con);color:var(--con)}
td.tot{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;width:90px;padding-right:8px}
tr.ot td.lbl{color:#b45309}
@media (prefers-color-scheme:dark){tr.ot td.lbl{color:#f0a64a}}
.df{display:flex;gap:8px;justify-content:space-between;padding:0 16px 14px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--mute);cursor:pointer;font-size:13px;padding:4px 2px;text-decoration:underline}
.link:hover{color:var(--ink)}
.link.del:hover{color:#d33}
.add{border:2px dashed var(--line);background:transparent;border-radius:12px;padding:16px;cursor:pointer;font-weight:600;color:var(--mute);width:100%}
.add:hover{border-color:var(--mute);color:var(--ink)}
aside{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:20px}
.side{position:sticky;top:16px}
.info{background:var(--panel);color:var(--panel-ink);border-radius:14px;padding:18px 20px;margin-top:16px}
.info .ih{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.info h2{margin:0;font-size:15px;font-weight:500;color:#aab7c4}
.info .link{color:#8393a4}.info .link:hover{color:#fff}
.info label{display:block;font-size:12px;color:#8393a4;margin:12px 0 4px}
.info textarea{min-height:100px;resize:vertical;line-height:1.45;overflow:hidden;margin-top:6px}
.info input,.info textarea{font:inherit;width:100%;background:#0e151d;border:1px solid #2b3744;color:#fff;border-radius:8px;padding:8px 10px;color-scheme:dark}
.info input:focus,.info textarea:focus{border-color:var(--accent);outline:none}
aside h2{margin:0 0 14px;font-size:15px;font-weight:500;color:#aab7c4}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid #2b3744;font-variant-numeric:tabular-nums}
.row span{color:#c4cfda;font-size:14px}
.row b{font-size:18px;font-weight:600}
.big{padding-top:18px}
.big span{color:var(--accent);font-weight:600}
.big b{font-size:40px;font-weight:700;color:#fff;line-height:1}
.note{font-size:12px;color:#8393a4;margin:12px 0 0}
.leg{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:#aab7c4}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.tprint,.pdfdata{display:none}
.dirty{color:#ff9a5c;font-size:13px;font-weight:600;align-self:center;margin-right:4px}
.btn.danger{background:#d33;border-color:#d33;color:#fff;font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:22px;width:min(360px,90vw)}
dialog::backdrop{background:rgba(10,15,21,.55)}
dialog p{margin:0 0 18px;font-size:15px}
.dbtn{display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#16202b;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;border:1px solid #3a4756}
.toast.on{opacity:1}
@media (max-width:860px){
  main{grid-template-columns:1fr}
  .side{position:static;order:-1}
}
@media print{
  .grip{display:none}
  .top input{display:none}
  .tprint{display:block;font-size:22px;font-weight:600;color:#000;overflow-wrap:anywhere}
  .dl{width:280px}
  .pdfdata{display:block;font-size:1px;line-height:1px;color:#fff;word-break:break-all;margin-top:6px;overflow:hidden}
  :root{--bg:#fff;--card:#fff;--ink:#000;--mute:#444;--line:#bbb;--field:#fff;--outage-soft:#fff8d6;--non-soft:#eceff2;--con-soft:#e1f2fc}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header{background:#fff;color:#000;border-bottom:2px solid #000}
  .top h1{color:#444}
  .top input{color:#000;border-color:#999}
  header .actions,.add,.df,.toast{display:none}
  body{background:#fff;color:#000}
  main{grid-template-columns:1fr}
  .side{position:static}
  aside,.info{background:#fff;color:#000;border:1px solid #999}
  .info *{color:#000!important}
  .info input,.info textarea{background:#fff;border:0;padding-left:0}
  .info .link{display:none}
  aside *{color:#000!important}
  .day{break-inside:avoid}
}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div style="flex:1;min-width:260px">
      <h1>Field service breakdown hours</h1>
      <div id="titlePrint" class="tprint"></div>
      <input id="title" autocomplete="off" aria-label="Job title and reference" placeholder="Job title, address and reference numbers">
    </div>
    <div class="actions">
      <span class="dirty" id="dirty" hidden>Unsaved changes</span>
      <button class="btn primary" id="save">Save to file</button>
      <button class="btn dark" id="open">Open file</button>
      <input type="file" id="file" accept=".html,.htm,.fshb,.json,.pdf" hidden>
      <button class="btn dark" id="copy">Copy summary</button>
      <button class="btn dark" id="print">Print</button>
      <button class="btn dark" id="pdf">Print to PDF</button>
      <button class="btn dark" id="reset">Clear all</button>
    </div>
  </div>
</header>

<div class="wrap">
<main>
  <section class="days" id="days" aria-label="Work days"></section>
  <div class="side">
  <aside aria-label="Totals">
    <h2>Job totals</h2>
    <div class="row"><span>Work hrs</span><b id="sWork">0</b></div>
    <div class="row"><span>Stand down hrs</span><b id="sStand">0</b></div>
    <div class="row"><span>Total</span><b id="sTotal">0</b></div>
    <div class="row big"><span>Plus 10%</span><b id="sPlus">0</b></div>
    <p class="note">Work hrs = prep and work hours total<br>Stand down hrs = stand down and sleeper total</p>
    <div class="leg"><span><i style="background:#f5c400"></i>Outage day</span><span><i style="background:#8a96a3"></i>Non outage</span><span><i style="background:#1f8fd1"></i>Contractor work</span></div>
  </aside>
  <section class="info" aria-label="Prepared by">
    <div class="ih"><h2>Prepared by</h2><button class="link" id="infoClear">Clear all</button></div>
    <label for="iname">Name</label>
    <input id="iname" autocomplete="name" maxlength="80" placeholder="Your name">
    <label for="idate">Date</label>
    <input id="idate" type="date">
  </section>
  <section class="info" aria-label="Notes">
    <div class="ih"><h2>Notes</h2></div>
    <textarea id="notes" rows="4" maxlength="5000" placeholder="Add any notes for this job"></textarea>
  </section>
  </div>
</main>
<div class="pdfdata" id="pdfdata" aria-hidden="true"></div>
</div>
<div class="toast" id="toast"></div>
<dialog id="dlg" aria-labelledby="dmsg"><p id="dmsg"></p><div class="dbtn"><button class="btn" id="dno">Cancel</button><button class="btn danger" id="dyes">Delete</button></div></dialog>

<script id="saved-data" type="application/json"></script>
<script>
const ROWS=[
  {k:'prep',l:'Prep',g:'work'},
  {k:'stand',l:'Stand down',g:'stand'},
  {k:'day',l:'Work hours',g:'work'},
  {k:'sleep',l:'Sleeper',g:'stand'}
];
const TYPES={outage:'Outage day',non:'Non outage',con:'Contractor work'};
const MODES={prep:{l:'Prep',rows:['prep']},day:{l:'Day work',rows:['day']},night:{l:'Night work',rows:['stand','day','sleep']}};
const vis=d=>(MODES[d.mode]||MODES.day).rows.map(k=>ROWS.find(r=>r.k===k));
const KEY='fshb.v1';
let uid=1, S={title:'',days:[]};

const blank=()=>({id:uid++,type:'outage',label:'',mode:'day',desc:'',rows:{prep:['','',''],stand:['','',''],day:['','',''],sleep:['','','']}});
const n=v=>{const x=parseFloat(v);return isFinite(x)&&x>0?x:0};
const rt=r=>(n(r[0])+n(r[1]))*n(r[2]);
const f=v=>{const r=Math.round(v*100)/100;return r.toLocaleString('en-AU',{maximumFractionDigits:2})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fromData(d){
  if(!d||!Array.isArray(d.days)||!d.days.length)throw new Error('bad');
  const days=d.days.map(x=>{const b=blank();b.type=TYPES[x.type]?x.type:'outage';b.desc=String(x.desc||'');b.label=String(x.label||'');
    const rv=k=>x.rows&&x.rows[k]&&x.rows[k].some(v=>n(v)>0);
    b.mode=MODES[x.mode]?x.mode:(rv('stand')||rv('sleep')?'night':(rv('prep')&&!rv('day')?'prep':'day'));
    ROWS.forEach(r=>{const v=(x.rows&&x.rows[r.k])||[];b.rows[r.k]=[0,1,2].map(i=>v[i]==null?'':String(v[i]))});return b});
  return {title:String(d.title||''),notes:String(d.notes||'').slice(0,5000),days};
}
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let INFO={name:'',date:'',manual:false},INFO_SET=false;
const IKEY='fshb.info';
function setInfo(d){INFO={name:String(d.name||'').slice(0,80),date:/^\d{4}-\d\d-\d\d$/.test(d.date||'')?d.date:'',manual:!!d.manual};INFO_SET=true}
function saveInfo(){try{localStorage.setItem(IKEY,JSON.stringify(INFO))}catch(e){}}
function loadInfo(){try{const d=JSON.parse(localStorage.getItem(IKEY));if(d)setInfo(d)}catch(e){}if(!INFO.manual||!INFO.date)INFO.date=todayStr();INFO_SET=true}
function showInfo(){document.getElementById('iname').value=INFO.name;document.getElementById('idate').value=INFO.date}
let EMB=false,DIRTY=false;
function setDirty(v){DIRTY=v;const e=document.getElementById('dirty');if(e)e.hidden=!v}
function load(){
  try{const e=document.getElementById('saved-data').textContent.trim();if(e){const d=JSON.parse(e);S=fromData(d);EMB=true;if(d.info)setInfo(d.info);return}}catch(e){}
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.days){S=fromData(d)}}catch(e){}
  if(!S.days.length)S.days.push(blank());
}
function save(){setDirty(true);if(EMB)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function rowHtml(d,r){
  const v=d.rows[r.k];
  return `<tr><td class="lbl">${r.l}${r.g==='stand'?`<button class="cp" data-copy="${d.id}" data-key="${r.k}" title="Copy the Work hours row's TSW, GSW and hours">Copy work hrs</button>`:''}</td>`+
    [0,1,2].map(i=>`<td><input type="number" inputmode="decimal" enterkeyhint="next" min="0" step="any" aria-label="${r.l} ${['TSW','GSW','hours'][i]}" data-d="${d.id}" data-k="${r.k}" data-i="${i}" value="${esc(v[i])}"></td>`).join('')+
    `<td class="tot" data-t="${d.id}-${r.k}">0</td></tr>`;
}
function render(){
  const el=document.getElementById('days');
  el.innerHTML=S.days.map((d,ix)=>`
  <article class="day" data-id="${d.id}" data-type="${d.type}">
    <div class="dh">
      <div>
        <div class="meta">${S.days.length>1?`<button class="grip" data-grip="${d.id}" title="Drag to reorder" aria-label="Reorder day. Drag, or use the up and down arrow keys"><svg width="12" height="18" viewBox="0 0 12 18" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.6"/><circle cx="9" cy="3" r="1.6"/><circle cx="3" cy="9" r="1.6"/><circle cx="9" cy="9" r="1.6"/><circle cx="3" cy="15" r="1.6"/><circle cx="9" cy="15" r="1.6"/></svg></button>`:''}<input class="dl" data-label="${d.id}" aria-label="Day name" value="${esc(d.label||'Day '+(ix+1))}" maxlength="40">
          ${d.type==='con'?'':`<select data-mode-for="${d.id}" aria-label="Work type">${Object.entries(MODES).map(([k,m])=>`<option value="${k}" ${k===d.mode?'selected':''}>${m.l}</option>`).join('')}</select>`}
          <select data-type-for="${d.id}" aria-label="Day type">${Object.entries(TYPES).map(([k,l])=>`<option value="${k}" ${k===d.type?'selected':''}>${l}</option>`).join('')}</select>
        </div>
        <textarea data-desc="${d.id}" rows="2" aria-label="Work description" placeholder="${d.type==='con'?'Describe what the contractor is doing':'Describe the work for this day'}">${esc(d.desc)}</textarea>
      </div>
      ${d.type==='con'?'':`<div class="dt"><small>Total day</small><strong data-day="${d.id}">0</strong></div>`}
    </div>
    ${d.type==='con'?'':`<div class="grid"><table>
      <thead><tr><th>Work</th><th>TSW</th><th>GSW</th><th>Hrs</th><th>Total</th></tr></thead>
      <tbody>${vis(d).map(r=>rowHtml(d,r)).join('')}</tbody>
    </table></div>`}
    <div class="df">
      <span></span>
      <button class="link del" data-del="${d.id}">Delete day</button>
    </div>
  </article>`).join('')+`<button class="add" id="addDay">Add another day</button>`;
  calc();showNotes();document.querySelectorAll('[data-desc]').forEach(grow);
}
function calc(){
  let work=0,stand=0;
  S.days.forEach(d=>{
    if(d.type==='con')return;
    let day=0;
    const list=vis(d).map(r=>[r,d.rows[r.k]]);
    list.forEach(([r,v])=>{
      const t=rt(v); day+=t;
      if(r.g==='work')work+=t;else stand+=t;
      const c=document.querySelector(`[data-t="${d.id}-${r.k}"]`); if(c)c.textContent=f(t);
    });
    const dc=document.querySelector(`[data-day="${d.id}"]`); if(dc)dc.textContent=f(day);
  });
  const tot=work+stand;
  sWork.textContent=f(work);sStand.textContent=f(stand);sTotal.textContent=f(tot);sPlus.textContent=f(tot*1.1);
  return {work,stand,tot,plus:tot*1.1};
}
function ask(msg,ok){
  return new Promise(res=>{
    const d=document.getElementById('dlg'),y=document.getElementById('dyes'),no=document.getElementById('dno');
    document.getElementById('dmsg').textContent=msg;y.textContent=ok;
    const done=v=>{y.onclick=no.onclick=d.oncancel=null;if(d.open)d.close();res(v)};
    y.onclick=()=>done(true);no.onclick=()=>done(false);d.oncancel=e=>{e.preventDefault();done(false)};
    try{d.showModal();no.focus()}catch(err){done(window.confirm(msg))}
  });
}
const grow=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px'};
function showNotes(){const t=document.getElementById('notes');if(!t)return;t.value=S.notes||'';grow(t)}
const find=id=>S.days.find(d=>d.id==id);
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),1800)};

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){if(parseFloat(t.value)<0)t.value='';const d=find(t.dataset.d);d.rows[t.dataset.k][t.dataset.i]=t.value;calc();save()}
  else if(t.dataset.label){find(t.dataset.label).label=t.value;save()}
  else if(t.dataset.desc){find(t.dataset.desc).desc=t.value;grow(t);save()}
  else if(t.id==='title'){S.title=t.value;save()}
  else if(t.id==='notes'){S.notes=t.value;grow(t);save()}
  else if(t.id==='iname'){INFO.name=t.value;saveInfo();setDirty(true)}
  else if(t.id==='idate'){INFO.date=t.value;INFO.manual=!!t.value;saveInfo();setDirty(true)}
});
document.addEventListener('change',e=>{
  const mid=e.target.dataset.modeFor;
  if(mid){const d=find(mid);d.mode=e.target.value;if(d.mode==='prep')d.type='non';render();save();return}
  const id=e.target.dataset.typeFor;
  if(id){const d=find(id);d.type=e.target.value;render();save()}
});
document.addEventListener('click',e=>{
  const t=e.target, ds=t.dataset;
  if(t.id==='addDay'){S.days.push(blank());render();save()}
  else if(ds.copy){const d=find(ds.copy);d.rows[ds.key]=[...d.rows.day];render();save()}
  else if(ds.del){ask('Delete this day and its hours?','Delete day').then(ok=>{if(!ok)return;S.days=S.days.filter(d=>d.id!=ds.del);if(!S.days.length)S.days.push(blank());render();save()})}
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t.dataset||!t.dataset.k)return;
  if(['-','+','e','E'].includes(e.key)){e.preventDefault();return}
  if(e.key==='Enter'){
    e.preventDefault();
    const all=[...document.querySelectorAll('input[data-k]')],i=all.indexOf(t),nx=all[i+(e.shiftKey?-1:1)];
    if(nx){nx.focus();nx.select()}else t.blur();
  }
});
window.addEventListener('beforeunload',e=>{if(DIRTY){e.preventDefault();e.returnValue=''}});
function doPrint(tip){
  const old=document.title;
  document.title=document.getElementById('title').value.trim()||'Field service hours';
  const back=()=>{document.title=old;window.removeEventListener('afterprint',back)};
  window.addEventListener('afterprint',back);
  if(tip)toast("In the print window, set the printer to 'Save as PDF'");
  setTimeout(()=>window.print(),tip?800:0);
}
document.getElementById('infoClear').onclick=()=>{INFO={name:'',date:todayStr(),manual:false};saveInfo();showInfo();setDirty(true)};
document.getElementById('print').onclick=()=>doPrint(false);
document.getElementById('pdf').onclick=()=>doPrint(true);
document.getElementById('reset').onclick=()=>{
  ask('Clear the job title, notes and every day? Your name and date are kept. This cannot be undone.','Clear all').then(ok=>{if(!ok)return;S={title:'',notes:'',days:[blank()]};document.getElementById('title').value='';render();save()});
};
document.getElementById('copy').onclick=()=>{
  const r=calc();
  let out=(S.title||'Field service breakdown hours')+'\n\n';
  S.days.forEach((d,i)=>{
    if(d.type==='con'){out+=`${d.label||'Day '+(i+1)} (${TYPES.con})${d.desc?': '+d.desc:''}\n\n`;return}
    const rows=vis(d).map(x=>[x,d.rows[x.k]]);
    out+=`${d.label||'Day '+(i+1)} (${MODES[d.mode].l}, ${TYPES[d.type]})${d.desc?': '+d.desc:''}\n`;
    rows.forEach(([x,v])=>{out+=`  ${x.l}: ${n(v[0])} TSW + ${n(v[1])} GSW x ${n(v[2])} hrs = ${f(rt(v))}\n`});
    out+=`  Total day: ${f(rows.reduce((a,[,v])=>a+rt(v),0))}\n\n`;
  });
  out+=`Work hrs: ${f(r.work)}\nStand down hrs: ${f(r.stand)}\nTotal: ${f(r.tot)}\nPlus 10%: ${f(r.plus)}`;
  if((S.notes||'').trim())out+=`\n\nNotes:\n${S.notes.trim()}`;
  if(INFO.name||INFO.date)out+=`\n\nPrepared by: ${INFO.name}${INFO.date?'  Date: '+INFO.date.split('-').reverse().join('/'):''}`;
  (navigator.clipboard?navigator.clipboard.writeText(out):Promise.reject()).then(()=>toast('Summary copied'),()=>toast('Copy not available in this browser'));
};

document.getElementById('save').onclick=async()=>{
  S.title=document.getElementById('title').value.trim();
  const name=S.title.replace(/[\\/:*?"<>|\u0000-\u001f]+/g,' ').replace(/\s+/g,' ').replace(/^[.\s]+|[.\s]+$/g,'').slice(0,100)||'field-service-hours';
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#saved-data').textContent=JSON.stringify({title:S.title,notes:S.notes||'',days:S.days,info:INFO}).replace(/</g,'\\u003c');
  c.querySelector('#days').innerHTML='';
  c.querySelector('#toast').className='toast';
  c.querySelector('#dirty').hidden=true;
  c.querySelector('#pdfdata').textContent='';c.querySelector('#titlePrint').textContent='';
  const blob=new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'});
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name+'.html',types:[{description:'Field service hours job',accept:{'text/html':['.html']}}]});
      const w=await h.createWritable();await w.write(blob);await w.close();
      setDirty(false);toast('Saved '+h.name);return;
    }catch(err){if(err&&err.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.html';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  setDirty(false);toast('Saved '+name+'.html');
};
document.getElementById('open').onclick=()=>document.getElementById('file').click();
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const loadScript=src=>new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('load'));document.head.appendChild(t)});
async function pdfText(buf){
  if(!window.pdfjsLib){await loadScript(PDFJS+'pdf.min.js');await loadScript(PDFJS+'pdf.worker.min.js')}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let i=1;i<=pdf.numPages;i++){const c=await (await pdf.getPage(i)).getTextContent();out+=c.items.map(x=>x.str).join('')}
  return out;
}
function b64u(str){
  const b=new TextEncoder().encode(str);let bin='';
  for(let i=0;i<b.length;i+=8192)bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromPdfText(t){
  const m=t.replace(/\s+/g,'').match(/FSHB1START([A-Za-z0-9_-]+?)FSHB1END/);
  if(!m)return null;
  let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))));
}
function applyJob(d,name){
  S=fromData(d);
  if(d.info){setInfo(d.info);saveInfo();showInfo()}
  document.getElementById('title').value=S.title;render();save();setDirty(false);toast('Opened '+name);
}
async function openPdf(fl){
  toast('Reading PDF...');
  try{
    const d=fromPdfText(await pdfText(new Uint8Array(await fl.arrayBuffer())));
    if(!d){toast('No job data found in that PDF. Only PDFs made by this app can be reopened.');return}
    applyJob(d,fl.name);
  }catch(err){toast('Could not read that PDF. It needs an internet connection the first time.')}
}
function syncPrint(){
  document.getElementById('titlePrint').textContent=document.getElementById('title').value.trim();
  document.getElementById('pdfdata').textContent='FSHB1START'+b64u(JSON.stringify({title:S.title,notes:S.notes||'',days:S.days,info:INFO}))+'FSHB1END';
}
window.addEventListener('beforeprint',syncPrint);
window.addEventListener('afterprint',()=>{document.getElementById('pdfdata').textContent=''});
document.getElementById('file').onchange=e=>{
  const fl=e.target.files[0];e.target.value='';if(!fl)return;
  if(/\.pdf$/i.test(fl.name)||fl.type==='application/pdf'){openPdf(fl);return}
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      let txt=rd.result;
      if(/\.html?$/i.test(fl.name))txt=new DOMParser().parseFromString(txt,'text/html').getElementById('saved-data').textContent;
      const d=JSON.parse(txt);S=fromData(d);if(d.info){setInfo(d.info);saveInfo();showInfo()}
      document.getElementById('title').value=S.title;render();save();setDirty(false);toast('Opened '+fl.name);
    }catch(err){toast('That file could not be opened. Choose a job saved from this app.')}
  };
  rd.readAsText(fl);
};

function moveDay(id,dir){
  const i=S.days.findIndex(d=>d.id==id),j=i+dir;
  if(i<0||j<0||j>=S.days.length)return;
  [S.days[i],S.days[j]]=[S.days[j],S.days[i]];
  render();save();
  const g=document.querySelector(`[data-grip="${id}"]`);if(g)g.focus();
}
function startDrag(e,card){
  const list=document.getElementById('days'),add=document.getElementById('addDay');
  let y=e.clientY,startY=y,startS=window.scrollY,raf=0;
  card.classList.add('dragging');document.body.classList.add('dragging-body');
  const upd=()=>{
    card.style.transform=`translateY(${y-startY+(window.scrollY-startS)}px)`;
    const cr=card.getBoundingClientRect(),mid=cr.top+cr.height/2;
    let before=null;
    for(const o of list.querySelectorAll('.day')){
      if(o===card)continue;
      const r=o.getBoundingClientRect();
      if(r.top+r.height/2>mid){before=o;break}
    }
    const target=before||add;
    if(target!==card.nextElementSibling){
      const t0=cr.top;
      list.insertBefore(card,target);
      startY+=card.getBoundingClientRect().top-t0;
      card.style.transform=`translateY(${y-startY+(window.scrollY-startS)}px)`;
    }
  };
  const tick=()=>{
    const h=window.innerHeight,z=70;
    if(y<z)window.scrollBy(0,-Math.ceil((z-y)/4));
    else if(y>h-z)window.scrollBy(0,Math.ceil((y-(h-z))/4));
    upd();raf=requestAnimationFrame(tick);
  };
  const mv=ev=>{y=ev.clientY};
  const end=()=>{
    cancelAnimationFrame(raf);
    document.removeEventListener('pointermove',mv);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    document.body.classList.remove('dragging-body');
    const ids=[...list.querySelectorAll('.day')].map(x=>x.dataset.id);
    if(!ids.every((id,i)=>id==S.days[i].id)){S.days=ids.map(id=>S.days.find(d=>d.id==id));save()}
    render();
  };
  document.addEventListener('pointermove',mv);
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
  raf=requestAnimationFrame(tick);
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('[data-grip]');
  if(!g||(e.pointerType==='mouse'&&e.button!==0))return;
  e.preventDefault();startDrag(e,g.closest('.day'));
});
document.addEventListener('keydown',e=>{
  const g=e.target.dataset&&e.target.dataset.grip;
  if(g&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();moveDay(g,e.key==='ArrowUp'?-1:1)}
});
load();
if(!INFO_SET)loadInfo();
showInfo();
document.getElementById('title').value=S.title||'';
render();
</script>
</body>
